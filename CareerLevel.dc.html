    @keyframes mascotIdle { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(-2deg); } }

    @keyframes dogBounce { 0%,100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-6px) rotate(-4deg); } 60% { transform: translateY(0) rotate(3deg); } }
    @keyframes catIdle { 0%,100% { transform: scaleY(1) rotate(0deg); } 50% { transform: scaleY(0.965) rotate(-1.5deg); } }

    .road-heart { position: absolute; width: 14px; height: 13px; pointer-events: none; z-index: 8; animation: heartFloat 1.1s ease-out forwards; }
    .road-says { position: absolute; pointer-events: none; z-index: 8; font-size: 11px; font-weight: 800; color: #A8243F; background: #fff; border: 2px solid #D98BA8; padding: 2px 7px; white-space: nowrap; transform: translateX(-50%); animation: saysPop 1.2s ease-out forwards; }
    @keyframes petSquish { 0%,100% { transform: scale(1,1); } 35% { transform: scale(1.15,0.82); } 65% { transform: translateY(-6px) scale(0.94,1.08); } }
    @keyframes heartFloat { 0% { opacity: 0; transform: translate(0,0) scale(0.4); } 20% { opacity: 1; transform: translate(calc(var(--hx) * 0.3), -10px) scale(1); } 100% { opacity: 0; transform: translate(var(--hx), -46px) scale(0.8); } }
    @keyframes saysPop { 0% { opacity: 0; transform: translate(-50%, 6px) scale(0.6); } 18%,75% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
    .pet-hint { position: absolute; transform: translateX(-50%); z-index: 3; pointer-events: none; font-size: 10.5px; font-weight: 800; color: #A8243F; background: #fff; border: 1.5px solid #D98BA8; padding: 1px 6px; border-radius: 6px; white-space: nowrap; animation: hintBob 1.6s ease-in-out infinite; }
    @keyframes hintBob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,-4px); } }
    .road-tree { cursor: pointer; transform-origin: 50% 100%; z-index: 3; }
    .road-tree[data-shake="1"] { animation: treeShake 0.6s ease-in-out; }
    .road-tree:focus-visible, .road-areej:focus-visible { outline: 2px solid #2F7A6F; outline-offset: 3px; border-radius: 4px; }
    @keyframes treeShake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-7deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } }
    .road-leaf { position: absolute; width: 6px; height: 6px; pointer-events: none; z-index: 3; animation: leafFall 1.3s ease-in forwards; }
    @keyframes leafFall { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--lx), 52px) rotate(220deg); } }
    .road-areej[data-jump="1"] img { animation: areejJump 0.55s cubic-bezier(0.3,1.4,0.5,1) !important; }
    @keyframes areejJump { 0%,100% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(0) scale(1.08,0.9); } 55% { transform: translateY(-22px) scale(0.96,1.05); } }
    .road-quest-list { position: absolute; bottom: calc(100% + 8px); left: 0; min-width: 190px; background: #fff; border: 1.5px solid #E5D5F3; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 10px 24px rgba(33,31,46,0.14); opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 9; white-space: nowrap; }

    .road-quests:focus-visible { outline: 2px solid #A574C9; outline-offset: 2px; }
    .road-quests[data-bump="1"] { animation: pillBump 0.5s cubic-bezier(0.3,1.6,0.5,1); }
    @keyframes pillBump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18); background: #E5D5F3; } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .road-link:hover { text-decoration-thickness: 2.5px; }
    .road-link:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 2px; }
    .road-btn:focus-visible { outline: 2px solid #2F7A6F; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {

    }
  </style>
</helmet>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:700}}">
const CATEGORY_COLOR = {
  foundation: '#2F7A6F',
  design: '#B18FCF',
  data: '#D6A947',
  research: '#2F7A6F',
  lwise: '#D98BA8',
  leadership: '#D98BA8',
  remote: '#7C93D4',
  dfg: '#D9506A',
};
// Darker text shades for link labels, so they stay readable on white.
const LINK_INK = { remote: '#3E55A0', dfg: '#A8243F' };
const NODE_SPACING = 300;
const STOP_OFFSET = { lwise: -23, remote: -26, dfg: -40 };
const DOG_STOP = 1922;          // where Areej stops to say hi to the dog
const EXIT_X = 2190;            // she runs off the end of the road...
const ENTER_X = -140;           // ...and back in from the start
const CAT_CENTER = 759;         // cat sits between Develop for Good and Carbonteq
const MASCOT_HALF = 40;
const TRACK_PAD = 70;

// headLink / subLink: the words in the bubble that become the link
const RAW = [
  { category: 'foundation', role: 'Research Assistant', org: 'HCI Lab (CHISEL @ LUMS)', headline: 'Where it all began' },
  { category: 'remote', role: 'Product Designer', org: 'K2 Studio', headline: 'My first job – Rebuilding Ventura', headLink: 'Rebuilding Ventura', link: 'https://getventura.co', linkLabel: 'getventura.co' },
  { category: 'dfg', role: 'Designer', org: 'Develop for Good', headline: 'Designing MoLA Commons, an archive for African art', headLink: 'MoLA Commons', link: 'https://africanartagenda.art', linkLabel: 'African Art Agenda' },
  { category: 'design', role: 'Product Design Intern', org: 'Carbonteq', headline: 'Trained in product, design and development' },
  { category: 'lwise', role: 'Treasurer', org: 'LWiSE', headline: 'Executive member of the first women in science club on campus!' },
  { category: 'data', role: 'Data Analytics Intern', org: 'Systems Limited', headline: 'Learnt all things data from SQL Optimization to Schema Design' },
  { category: 'leadership', role: 'Campus Ambassador', org: "atomcamp & L'Oréal", headline: 'Represented reputed companies building my professional network' },
];
const LAST = RAW.length - 1;
const STOP_MS = 15000;

const easeWalk = (t) => -(Math.cos(Math.PI * t) - 1) / 2;   // gentle start, gentle stop
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const stopX = (i) => i * NODE_SPACING + (STOP_OFFSET[RAW[i].category] ?? 1);

class Component extends DCLogic {
  state = { activeIndex: 0, reached: 1, isWalking: false, facingLeft: false, userPaused: false, petCount: 0, toast: '', found: {} };

  setScrollRef = (el) => { this.scrollEl = el; };
  setMascotRef = (el) => { this.mascotEl = el; if (el) this.paint(true, 0, 0); };
  setBarRef = (el) => { this.barEl = el; };
  setCatRef = (el) => { this.catEl = el; };
  setDogRef = (el) => { this.dogEl = el; };
  setAreejRef = (el) => { this.areejEl = el; };
  setRootRef = (el) => { this.rootEl = el; };

  componentDidMount() {
    this.reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.x = stopX(0);
    this.cam = 0;
    this.bar = 1 / RAW.length;
    this.phase = { type: 'dwell', index: 0, remain: STOP_MS };
    this.hover = false;
    this.focusIn = false;
    this.interactUntil = 0;
    this.visible = false;

    const interact = () => { this.interactUntil = performance.now() + 3500; };
    this._listeners = [];
    const on = (el, ev, fn, opts) => { if (!el) return; el.addEventListener(ev, fn, opts); this._listeners.push([el, ev, fn, opts]); };
    on(this.scrollEl, 'wheel', interact, { passive: true });
    on(this.scrollEl, 'touchstart', interact, { passive: true });
    on(this.scrollEl, 'touchmove', interact, { passive: true });
    // Only pause while someone is reading a bubble or petting an animal; otherwise she keeps running.
    on(this.rootEl, 'mouseover', (e) => { this.hover = !!(e.target.closest && e.target.closest('.road-bubble, .road-pet, .road-areej, .road-quests')); });
    on(this.rootEl, 'mouseleave', () => { this.hover = false; });
    on(this.rootEl, 'focusin', () => { this.focusIn = true; });
    on(this.rootEl, 'focusout', () => { this.focusIn = false; });
    on(document, 'visibilitychange', () => { this.last = performance.now(); });
    const pet = (kind) => (e) => {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      if (e.type === 'keydown') e.preventDefault();
      this.pet(kind);
    };
    on(this.catEl, 'click', pet('cat'));
    on(this.catEl, 'keydown', pet('cat'));
    on(this.dogEl, 'click', pet('dog'));
    on(this.dogEl, 'keydown', pet('dog'));
    const act = (fn) => (e) => {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      if (e.type === 'keydown') e.preventDefault();
      fn(e.currentTarget);
    };
    on(this.areejEl, 'click', act(() => this.sayHi()));
    on(this.areejEl, 'keydown', act(() => this.sayHi()));
    if (this.rootEl) this.rootEl.querySelectorAll('.road-tree').forEach((t) => {
      on(t, 'click', act((el) => this.shakeTree(el)));
      on(t, 'keydown', act((el) => this.shakeTree(el)));
    });

    if (this.rootEl && typeof IntersectionObserver === 'function') {
      this.io = new IntersectionObserver(([e]) => {
        this.visible = e.isIntersecting;
        if (this.visible) this.startLoop(); else this.stopLoop();
      }, { threshold: 0.3 });
      this.io.observe(this.rootEl);
    } else {
      this.visible = true;
      this.startLoop();
    }
    this.paint(true, 0, 0);
  }

  componentWillUnmount() {
    this.stopLoop();
    if (this.io) this.io.disconnect();
    clearTimeout(this._toastT);
    (this._listeners || []).forEach(([el, ev, fn, opts]) => el.removeEventListener(ev, fn, opts));
  }

  startLoop() {
    if (this.raf) return;
    this.last = performance.now();
    this.raf = requestAnimationFrame(this.tick);
  }

  stopLoop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
  }

  // ---- the road trip ----

  tick = (now) => {
    const dt = Math.min(now - this.last, 48);
    this.last = now;
    const holding = this.reduced || this.state.userPaused || document.hidden;
    const ph = this.phase;

    if (ph.type === 'walk') {
      ph.t += dt;
      const p = Math.min(1, ph.t / ph.dur);
      this.x = ph.x0 + (ph.x1 - ph.x0) * easeWalk(p);
      if (p >= 1) this.arrive(ph.target);
    } else if (ph.type === 'dwell') {
      if (!holding) ph.remain -= dt;
      if (ph.remain <= 0) this.walkTo(ph.index < LAST ? ph.index + 1 : 'dog');
    } else if (ph.type === 'rest') {
      if (!holding) ph.remain -= dt;
      if (ph.remain <= 0) this.walkTo('exit');
    } else if (ph.type === 'fadeout') {
      ph.t += dt;
      if (ph.t >= 480) {
        this.x = ENTER_X;
        this.setFacing(false);
        this.setState({ reached: 1 });
        this.phase = { type: 'rewind', t: 0 };
      }
    } else if (ph.type === 'rewind') {
      ph.t += dt;
      if ((Math.abs(this.cam - this.camTarget()) < 3 && ph.t > 400) || ph.t > 1700) {
        this.walkTo(0);
      }
    }

    this.paint(false, dt, now);
    this.raf = requestAnimationFrame(this.tick);
  };

  walkTo(target) {
    const x1 = target === 'dog' ? DOG_STOP : target === 'exit' ? EXIT_X : stopX(target);
    const x0 = this.x;
    if (this.mascotEl) this.mascotEl.style.opacity = '1';
    if (this.reduced) {
      this.x = x1;
      this.arrive(target);
      return;
    }
    const dist = Math.abs(x1 - x0);
    this.setFacing(x1 < x0);
    this.phase = { type: 'walk', target, x0, x1, t: 0, dur: clamp(dist * 2.9, 520, 1700) };
    this.setState({ activeIndex: -1, isWalking: true });
  }

  arrive(target) {
    if (target === 'exit') {
      this.phase = { type: 'fadeout', t: 0 };
      if (this.mascotEl) this.mascotEl.style.opacity = '0';
      return;
    }
    if (target === 'dog') {
      this.phase = { type: 'rest', remain: 1300 };
      this.setState({ isWalking: false });
      return;
    }
    const linger = STOP_MS;   // she waits 15 seconds at every stop (hovering a bubble still pauses her)
    this.clickBoost = false;
    this.phase = { type: 'dwell', index: target, remain: linger };
    this.setFacing(false);
    this.setState((s) => ({ activeIndex: target, isWalking: false, reached: Math.max(s.reached, target + 1) }));
  }

  select(i) {
    const ph = this.phase;
    if (ph.type === 'dwell' && ph.index === i) {
      // Clicking the building she's standing at opens its link.
      if (RAW[i].link) window.open(RAW[i].link, '_blank', 'noopener');
      return;
    }
    if (ph.type === 'walk' && ph.target === i) return;
    this.clickBoost = true;
    this.walkTo(i);
  }

  // ---- petting ----
  pet(kind) {
    const el = kind === 'cat' ? this.catEl : this.dogEl;
    if (!el) return;
    el.dataset.pet = '0';
    void el.offsetWidth;
    el.dataset.pet = '1';
    clearTimeout(el._petT);
    el._petT = setTimeout(() => { el.dataset.pet = '0'; }, 950);
    const host = el.parentElement;
    const cx = el.offsetLeft + el.offsetWidth / 2, top = el.offsetTop;
    for (let k = 0; k < 3; k++) {
      const h = document.createElement('span');
      h.className = 'road-heart';
      h.style.left = (cx - 7 + (k - 1) * 9) + 'px';
      h.style.top = (top - 4) + 'px';
      h.style.setProperty('--hx', ((k - 1) * 14 + (Math.random() * 8 - 4)) + 'px');
      h.style.animationDelay = (k * 0.09) + 's';
      h.innerHTML = '<svg width="14" height="13" viewBox="0 0 7 6" shape-rendering="crispEdges"><path fill="' + (k === 1 ? '#D9506A' : '#D98BA8') + '" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1Z"/></svg>';
      host.appendChild(h);
      setTimeout(() => h.remove(), 1400);
    }
    const lines = kind === 'cat' ? ['purr', 'mrrp!', 'prrrr', 'meow'] : ['woof!', 'arf!', 'wag wag', 'bork'];
    const say = document.createElement('span');
    say.className = 'road-says';
    say.textContent = lines[Math.floor(Math.random() * lines.length)];
    say.style.left = cx + 'px';
    say.style.top = (top - 30) + 'px';
    host.appendChild(say);
    setTimeout(() => say.remove(), 1300);

    this.pets = this.pets || { cat: 0, dog: 0 };
    this.pets[kind] += 1;
    const total = this.pets.cat + this.pets.dog;
    this.setState({ petCount: total });
    this.find(kind);
  }

  sayHi() {
    const el = this.areejEl;
    if (!el) return;
    el.dataset.jump = '0'; void el.offsetWidth; el.dataset.jump = '1';
    clearTimeout(el._jT); el._jT = setTimeout(() => { el.dataset.jump = '0'; }, 600);
    const lines = ['hi!', 'thanks for visiting!', 'hire me? :)', 'keep scrolling!'];
    this._hiN = (this._hiN || 0) + 1;
    const say = document.createElement('span');
    say.className = 'road-says';
    say.textContent = lines[(this._hiN - 1) % lines.length];
    say.style.left = (this.x + MASCOT_HALF) + 'px';
    say.style.top = '120px';
    this.mascotEl.parentElement.appendChild(say);
    setTimeout(() => say.remove(), 1300);
    this.find('areej');
  }

  shakeTree(el) {
    el.dataset.shake = '0'; void el.offsetWidth; el.dataset.shake = '1';
    clearTimeout(el._sT); el._sT = setTimeout(() => { el.dataset.shake = '0'; }, 650);
    const host = el.parentElement, cx = el.offsetLeft + el.offsetWidth / 2, top = el.offsetTop + 8;
    const greens = ['#7DB24A', '#5E9A3A', '#A7C957', '#D6A947'];
    for (let k = 0; k < 5; k++) {
      const leaf = document.createElement('span');
      leaf.className = 'road-leaf';
      leaf.style.left = (cx - 14 + Math.random() * 28) + 'px';
      leaf.style.top = (top + Math.random() * 14) + 'px';
      leaf.style.background = greens[k % greens.length];
      leaf.style.setProperty('--lx', (Math.random() * 30 - 15) + 'px');
      leaf.style.animationDelay = (k * 0.07) + 's';
      host.appendChild(leaf);
      setTimeout(() => leaf.remove(), 1600);
    }
    this.find('tree');
  }

  // Road secrets: cat, dog, Areej, a tree.
  find(key) {
    if (this.state.found[key]) return;
    this.setState({ found: { ...this.state.found, [key]: true } });
    // No pop-up messages: the secrets pill just gives a little bounce when the count goes up.
    const pill = this.rootEl && this.rootEl.querySelector('.road-quests');
    if (pill) { pill.dataset.bump = '0'; void pill.offsetWidth; pill.dataset.bump = '1'; }
  }

  setFacing(left) {
    if (this.state.facingLeft !== left) this.setState({ facingLeft: left });
  }

  camTarget() {
    const el = this.scrollEl;
    if (!el) return 0;
    const max = Math.max(0, el.scrollWidth - el.clientWidth);
    // While Areej stands at a stop, frame the building (and its link) rather than her.
    const ph = this.phase || {};
    let focus = this.x + MASCOT_HALF + 34;
    if (ph.type === 'dwell') {
      focus = ph.index * NODE_SPACING + 75;
    }
    return clamp(focus + TRACK_PAD - el.clientWidth / 2, 0, max);
  }

  // Writes positions straight to the DOM every frame, so React never re-renders mid-walk.
  paint(instant, dt, now) {
    const x = this.x ?? stopX(0);
    if (this.mascotEl) this.mascotEl.style.transform = `translate3d(${x.toFixed(2)}px,0,0)`;

    const el = this.scrollEl;
    if (el) {
      if (!instant && now < this.interactUntil) {
        this.cam = el.scrollLeft;            // visitor is scrolling: let them
      } else {
        const tau = this.phase && this.phase.type === 'rewind' ? 240 : 170;
        const k = instant || this.reduced ? 1 : 1 - Math.exp(-dt / tau);
        this.cam += (this.camTarget() - this.cam) * k;
        if (Math.abs(el.scrollLeft - this.cam) > 0.5) el.scrollLeft = this.cam;
      }
    }

    if (this.barEl) {
      const p = clamp((1 + ((x - stopX(0)) / (stopX(LAST) - stopX(0))) * LAST) / RAW.length, 0, 1);
      const k = instant ? 1 : 1 - Math.exp(-dt / 140);
      this.bar += (p - this.bar) * k;
      this.barEl.style.transform = `scaleX(${this.bar.toFixed(4)})`;
    }

    if (this.catEl) {
      const near = Math.abs(x + MASCOT_HALF - CAT_CENTER) < 80 ? '1' : '0';
      if (this.catEl.dataset.hop !== near) this.catEl.dataset.hop = near;
    }
  }

  renderVals() {
    const active = this.state.activeIndex;
    const nodes = RAW.map((n, i) => {
      const color = CATEGORY_COLOR[n.category];
      const isActive = i === active;
      const split = (text, word) => {
        const at = text && word ? text.indexOf(word) : -1;
        return at < 0 ? [text || '', '', ''] : [text.slice(0, at), word, text.slice(at + word.length)];
      };
      const [headBefore, headLink, headAfter] = split(n.headline, n.headLink);
      const [subBefore, subLink, subAfter] = split(n.subheadline || n.subLink, n.subLink);
      return {
        ...n,
        headBefore, headLink, headAfter,
        subheadline: n.subheadline || n.subLink || '',
        subBefore, subLink, subAfter,
        color,
        ink: LINK_INK[n.category] || color,
        xPx: `${i * NODE_SPACING}px`,
        isActive,
        isFoundation: n.category === 'foundation',
        isDesign: n.category === 'design',
        isData: n.category === 'data',
        isResearch: n.category === 'research',
        isLwise: n.category === 'lwise',
        isLeadershipOther: n.category === 'leadership',
        isLeadership: n.category === 'leadership' || n.category === 'lwise',
        isRemote: n.category === 'remote',
        isDfg: n.category === 'dfg',
        hoverBase: isActive ? 'scale(1.06)' : 'scale(1)',
        roleColor: isActive ? color : '#211F2E',
        shadowOpacity: isActive ? 0.32 : 0.14,
        pulseAnim: isActive ? 'groundPulse 1.6s ease-in-out infinite' : 'none',
        select: () => this.select(i),
      };
    });

    return {
      nodes,
      totalNodes: RAW.length,
      reached: this.state.reached,
      trackWidth: LAST * NODE_SPACING + 280,
      mascotAnim: this.state.isWalking ? 'mascotWalk 0.26s linear infinite' : 'mascotIdle 1.6s ease-in-out infinite',
      mascotFlip: this.state.facingLeft ? 'scaleX(-1)' : 'scaleX(1)',
      userPaused: this.state.userPaused,
      notPaused: !this.state.userPaused,
      pauseLabel: this.state.userPaused ? 'Resume the road trip' : 'Pause the road trip',
      togglePause: () => this.setState((s) => ({ userPaused: !s.userPaused })),
      setScrollRef: this.setScrollRef,
      setMascotRef: this.setMascotRef,
      setBarRef: this.setBarRef,
      setCatRef: this.setCatRef,
      setDogRef: this.setDogRef,
      petCount: this.state.petCount,
      setAreejRef: this.setAreejRef,
      hintCat: !this.state.found.cat,
      hintDog: !this.state.found.dog,
      questDone: Object.keys(this.state.found).length,
      questLabel: Object.keys(this.state.found).length + '/4 secrets',
      questAria: Object.keys(this.state.found).length + ' of 4 road secrets found',
      quests: [['cat', 'Pet the cat'], ['dog', 'Pet the dog'], ['areej', 'Say hi to Areej'], ['tree', 'Shake a tree']].map(([k, label]) => {
        const done = !!this.state.found[k];
        return { label, tick: done ? '\u2713' : '', box: done ? '#A574C9' : '#fff', color: done ? '#452256' : '#5C5668', weight: done ? 800 : 600 };
      }),
      toast: this.state.toast,
      setRootRef: this.setRootRef,
    };
  }
}
</script>
</body>
</html>
